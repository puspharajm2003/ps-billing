name: Build & Release Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup Node.js
        uses: actions/setup-node@1a4442cacd436585916f1b3aa94e4166f1a22160 # v3.8.2
        with:
          node-version: 18

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies and build
        run: |
          npm install
          cd frontend
          npm install
          npm run build
          cd ../backend
          npm install
          npm run build

      - name: Build Electron installer (no auto-publish)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub Release and upload .exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          $exeFile = Get-ChildItem -Path "dist" -Filter "*.exe" | Where-Object { $_.Name -notlike "*blockmap*" } | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "No .exe file found in dist/ directory!"
            exit 1
          }
          Write-Host "Found installer: $($exeFile.FullName)"

          # Check if release exists for this tag
          $releaseJson = gh release view $TAG --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $TAG not found. Creating a new draft release..."
            gh release create $TAG `
              --title "SMR Groups Billing System v$VERSION" `
              --notes "Desktop installer for SMR Groups Billing System v$VERSION" `
              --draft
          }

          Write-Host "Uploading $($exeFile.Name) to release $TAG ..."
          gh release upload $TAG "$($exeFile.FullName)" --clobber
          Write-Host "Upload complete!"

          # Publish the release if it was a draft
          gh release edit $TAG --draft=false 2>$null
          Write-Host "Release $TAG is now published."
